<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fusion Backup</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.6 "Segoe UI", "Yu Gothic UI", sans-serif; }
    * { box-sizing: border-box; text-align: left; }
    body { margin: 0; padding: 18px; background: #f7f8fa; color: #18212b; }
    #message { margin: 0 0 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    progress { display: block; width: 100%; height: 14px; margin: 0 0 16px; accent-color: #1685cf; }
    button { font: inherit; padding: 6px 16px; color: #fff; background: #0879bc; border: 0; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #cancel-note { margin: 10px 0 0; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      body { background: #303b4b; color: #f0f3f7; }
    }
  </style>
</head>
<body>
  <div id="message" aria-live="polite">バックアップを準備中…</div>
  <progress id="bar" aria-label="バックアップ進捗"></progress>
  <button id="cancel" type="button">Stop Backup</button>
  <p id="cancel-note" hidden>停止を受け付けました。現在の処理が終わるまでお待ちください。</p>
  <script>
    "use strict";
    window.fusionJavaScriptHandler = { handle(action, data) {
      if (action !== "progress") return "Unsupported action";
      try {
        const state = JSON.parse(data);
        // Cloud names are text, never HTML.
        document.getElementById("message").textContent = state.message;
        const bar = document.getElementById("bar");
        bar.max = Math.max(1, state.maximum);
        bar.value = Math.max(0, Math.min(state.value, bar.max));
        const cancel = document.getElementById("cancel");
        cancel.textContent = state.cancel_label;
        cancel.disabled = !state.cancel_enabled;
        cancel.hidden = !state.cancel_visible;
        return "OK";
      } catch (_) { return "Invalid progress data"; }
    }};
    function send(action) {
      if (window.adsk && typeof window.adsk.fusionSendData === "function") {
        return Promise.resolve(window.adsk.fusionSendData(action, ""));
      }
      return Promise.reject(new Error("Fusion bridge not ready"));
    }
    document.getElementById("cancel").addEventListener("click", async () => {
      const button = document.getElementById("cancel");
      button.disabled = true;
      try {
        await send("cancel");
        document.getElementById("cancel-note").hidden = false;
      } catch (_) {
        button.disabled = false;
        const note = document.getElementById("cancel-note");
        note.textContent = "停止要求を送れませんでした。もう一度押すか、この画面を閉じてください。";
        note.hidden = false;
      }
    });
    // The embedded browser can become ready after Python has begun scanning.
    async function ready() {
      try { await send("ready"); }
      catch (_) { setTimeout(ready, 200); }
    }
    ready();
  </script>
</body>
</html>
